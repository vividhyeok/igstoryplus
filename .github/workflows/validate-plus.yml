name: Validate Story Plus
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Static checks and test APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug :app:testDebugUnitTest :photoeditor:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Focused real Android and media checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 2
          disable-animations: true
          script: bash scripts/test_plus.sh
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-plus-verification
          path: |
            validation/plus*
            validation/custom-inline*
            validation/story-*
            app/build/reports/
            app/build/test-results/
            photoeditor/build/test-results/
          retention-days: 14

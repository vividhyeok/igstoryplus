name: Android verified APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare CLI tools
        run: |
          chmod +x gradlew
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Lint and unit tests
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :photoeditor:testDebugUnitTest --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android rendering and integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash scripts/android_test.sh
      - name: Inspect real rendered media
        run: python scripts/verify_media.py validation
      - name: Configure persistent release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/igstoryplus-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/igstoryplus-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.3.7-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER)) VERSION_NAME="$VERSION_NAME" ./gradlew :app:assembleRelease --console=plain
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/igstoryplus-v${VERSION_NAME}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/igstoryplus-v${VERSION_NAME}-universal.apk"
          cp validation/ffprobe-report.json dist/validation-report.json
          (cd validation && zip -q ../dist/ux-screenshots.zip ux-*.png editor-text-ime.png editor-text-styles.png pose-*.png beat-*.png beat-sync.json)
      - name: Inspect APK package and signature
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/*arm64-v8a.apk | tee dist/signature.txt
          "$BUILD_TOOLS/aapt" dump badging dist/*arm64-v8a.apk | tee dist/package.txt
          grep -q "com.vividhyeok.igstoryplus" dist/package.txt
          cd dist && sha256sum *.apk > SHA256SUMS
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            photoeditor/build/reports/
            validation/
            dist/
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            TAG="$GITHUB_REF_NAME"
            gh release create "$TAG" dist/* --verify-tag --title "igstoryplus $TAG" --notes-file docs/RELEASE_NOTES.md
          else
            REMOTE_HEAD="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [[ "$REMOTE_HEAD" != "$GITHUB_SHA" ]]; then exit 0; fi
            TAG="dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease --title "Development $VERSION_NAME" --notes-file docs/RELEASE_NOTES.md
          fi
      - name: Verify downloadable release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then TAG="$GITHUB_REF_NAME"; else TAG="dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          gh release download "$TAG" --pattern '*arm64-v8a.apk' --dir "$RUNNER_TEMP/release-download"
          cmp dist/*arm64-v8a.apk "$RUNNER_TEMP"/release-download/*arm64-v8a.apk
